<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Log</title>
<meta name="description" content="A compact personal habit tracker that works offline and syncs between your devices.">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="sync.js">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Log">
</head>
<body>
<div class="app">
  <header class="top gut">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Habit Log</div>
    <nav class="hnav-wrap" aria-label="Sections"><button class="tab hnav" data-act="tab" data-v="today">Today</button><button class="tab hnav" data-act="tab" data-v="stats">Stats</button></nav>
    <button class="sync-btn" id="syncBtn" data-act="sync" aria-label="Sync now"></button>
    <button class="sync-btn" id="setBtn" data-act="tab" data-v="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg></button>
  </header>
  <main class="gut" id="view"></main>
</div>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>Today</button>
    <button class="tab" data-act="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
  </div>
</nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
